<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Falcon Eye</title><link rel="stylesheet" href="/css/main.css"><script type="module" src="/js/auth.js"></script></head><body class="auth-body"><a class="brand auth-brand" href="/"><span class="brand-mark">F</span> FALCON EYE</a><main class="auth-card"><p class="eyebrow">CREATE YOUR WORKSPACE</p><h1>Join Falcon Eye</h1><p>Save areas and keep your analysis history together.</p><form id="auth-form"><label>Your name<input name="name" required minlength="2" maxlength="100" autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="10" autocomplete="new-password"><small>Use at least 10 characters.</small></label><label>Confirm password<input name="passwordConfirmation" type="password" required minlength="10" autocomplete="new-password"></label><button class="button full">Create account</button><p id="form-message" class="form-message" role="alert"></p></form><p class="auth-switch">Already registered? <a href="/login.html">Sign in</a></p></main></body></html>
