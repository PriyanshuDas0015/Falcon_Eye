<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Settings — Falcon Eye</title><link rel="stylesheet" href="/css/main.css"><script type="module" src="/js/account.js"></script></head><body class="workspace"><header class="workspace-header"><a class="brand" href="/"><span class="brand-mark">F</span> FALCON EYE</a><nav aria-label="Application navigation"><a href="/dashboard.html">Dashboard</a><a href="/dashboard.html#explorer">Explorer</a><a href="/dashboard.html#saved-areas-section">Saved Areas</a><a href="/dashboard.html#history">History</a><span id="nav-user" class="user-name"></span><button id="logout" class="text-button">Sign out</button></nav></header><main class="workspace-main narrow-main"><div class="workspace-title"><div><p class="eyebrow">ACCOUNT</p><h1>Account settings</h1><p>Manage your profile and password.</p></div></div><div class="settings-grid"><section class="settings-card"><h2>Profile</h2><form id="profile-form"><label>Name<input id="account-name" name="name" minlength="2" maxlength="100" required></label><label>Email address<input id="account-email" type="email" disabled></label><p class="field-note standalone">Member since <span id="account-created">—</span></p><button class="button">Save profile</button></form></section><section class="settings-card"><h2>Change password</h2><form id="password-form"><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input name="newPassword" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm new password<input name="confirmation" type="password" autocomplete="new-password" minlength="10" required></label><button class="button">Change password</button></form></section></div></main></body></html>
